# Auto Ontology for ERPNext - generated by Frappe2Ontology.
#
# Based on NVIDIA Auto Ontology's docker-compose.yml (Apache-2.0), hardened:
#   * only the web app is published, on ${AO_BIND}:3000 (127.0.0.1 by default);
#     the backend (3001) and ingestion service (3002) trust their callers and
#     must never be reachable from outside, so they have no ports here;
#   * Postgres is not published and pgAdmin is removed;
#   * with COMPOSE_PROFILES=https, Caddy serves the app on 443 with a free
#     Let's Encrypt certificate for ${DOMAIN};
#   * the backend can reach MariaDB on this host as host.docker.internal.
#
# Images are built from the NVIDIA/auto-ontology checkout in ./auto-ontology
# (setup.sh clones it at AUTO_ONTOLOGY_REF).

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auto-ontology:
    build:
      context: ./auto-ontology
      dockerfile: Dockerfile
    image: auto-ontology:local
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      INGESTION_SERVICE_URL: http://ingestion-service:3002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_started
      auto-ontology-migrate:
        condition: service_completed_successfully
      ingestion-service:
        condition: service_started

  ingestion-service:
    image: auto-ontology:local
    pull_policy: never  # built by the auto-ontology service
    restart: unless-stopped
    command: ["ingestion_service"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3002/health/live', timeout=3).status == 200 else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_started
      auto-ontology-migrate:
        condition: service_completed_successfully

  auto-ontology-migrate:
    image: auto-ontology:local
    pull_policy: never
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  frontend-migrate:
    build:
      context: ./auto-ontology/frontend
      dockerfile: Dockerfile
      args:
        PYTHON_API_URL: http://auto-ontology:3001
    image: auto-ontology-frontend:local
    working_dir: /app/migrate
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    command: ["sh", "prisma/migrate.sh"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  auto-ontology-frontend:
    image: auto-ontology-frontend:local
    pull_policy: never  # built by frontend-migrate
    restart: unless-stopped
    ports:
      - "${AO_BIND:-127.0.0.1}:3000:3000"
    env_file: .env
    environment:
      PYTHON_API_URL: http://auto-ontology:3001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      auto-ontology:
        condition: service_healthy
      frontend-migrate:
        condition: service_completed_successfully

  caddy:
    profiles: ["https"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - auto-ontology-frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
